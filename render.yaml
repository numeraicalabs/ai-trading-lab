# Single service — FastAPI serves the React build directly.
# No confusion between two URLs. The same URL is both API and frontend.
services:
  - type: web
    name: ai-trading-lab
    runtime: python
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: >
      pip install -r backend/requirements.txt &&
      npm --prefix frontend ci &&
      npm --prefix frontend run build &&
      mkdir -p backend/static &&
      cp -r frontend/dist/. backend/static/
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.19.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: INITIAL_CAPITAL
        value: "100000"
      - key: TRANSACTION_FEE_PCT
        value: "0.001"
      - key: SLIPPAGE_PCT
        value: "0.0005"
      - key: SIMULATION_TICK_SECONDS
        value: "8"
      - key: AGENTS_AUTO_START
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3

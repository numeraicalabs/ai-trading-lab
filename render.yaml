# Single web service — FastAPI serves both the REST API and the React SPA.
# No CORS confusion, no two-URL problem.
services:
  - type: web
    name: ai-trading-lab
    runtime: python
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: >
      pip install -r backend/requirements.txt &&
      npm --prefix frontend ci &&
      npm --prefix frontend run build &&
      mkdir -p backend/static &&
      cp -r frontend/dist/. backend/static/
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.19.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: INITIAL_CAPITAL
        value: "100000"
      - key: TRANSACTION_FEE_PCT
        value: "0.001"
      - key: SLIPPAGE_PCT
        value: "0.0005"
      - key: SIMULATION_TICK_SECONDS
        value: "8"
      - key: AGENTS_AUTO_START
        value: "true"
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: OLLAMA_MODEL
        value: llama3
      - key: ALPHA_VANTAGE_KEY
        value: demo
      - key: NEWS_API_KEY
        sync: false
      - key: USE_SYNTHETIC_DATA
        value: "true"
      - key: YFINANCE_TIMEOUT
        value: "8"
      - key: JOB_TIMEOUT_SECONDS
        value: "300"
      # Risk Manager
      - key: PORTFOLIO_DD_WARN
        value: "0.05"
      - key: PORTFOLIO_DD_HARD
        value: "0.10"
      - key: POSITION_DD_HARD
        value: "0.03"
      - key: RMG_CHECK_INTERVAL
        value: "15"
      # Auth (Supabase anon key for frontend magic-link login)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON
        sync: false
      # LLM Providers (all optional — free tier)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama3-70b-8192"
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HF_MODEL
        value: "mistralai/Mistral-7B-Instruct-v0.3"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "mistralai/mistral-7b-instruct:free"
      - key: LLM_TIMEOUT
        value: "30"
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: OLLAMA_MODEL
        value: "llama3" 

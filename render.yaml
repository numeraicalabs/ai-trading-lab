################################################################################
# render.yaml — Render Blueprint
# Deploys both backend (Web Service) and frontend (Static Site) automatically
################################################################################

services:
  # ── Backend: FastAPI ─────────────────────────────────────────────────────────
  - type: web
    name: ai-trading-lab-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: INITIAL_CAPITAL
        value: "100000"
      - key: TRANSACTION_FEE_PCT
        value: "0.001"
      - key: SLIPPAGE_PCT
        value: "0.0005"
      - key: SIMULATION_TICK_SECONDS
        value: "5"
      - key: AGENTS_AUTO_START
        value: "true"
      - key: YAHOO_FINANCE_ENABLED
        value: "true"

  # ── Frontend: React/Vite Static Site ─────────────────────────────────────────
  - type: web
    name: ai-trading-lab-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      - key: VITE_API_URL
        fromService:
          name: ai-trading-lab-api
          type: web
          property: host
      - key: VITE_WS_URL
        fromService:
          name: ai-trading-lab-api
          type: web
          property: host
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
